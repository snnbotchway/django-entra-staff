name: CI

on:
  # A change that touches only docs runs no checks. No code reads these files.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.scratch/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.scratch/**']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run vulture

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        django: ["5.2", "6.0", "6.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --python ${{ matrix.python }} --isolated --with "django==${{ matrix.django }}.*" pytest
