name: Release

# Run it from Actions → Release → Run workflow and pick how big the release is.
# It bumps the version, tests and builds, then commits the bump and tags it on
# main, and waits for a maintainer to approve publishing to PyPI. Pushing a `v*`
# tag by hand still works: it skips the bump and checks the tag instead.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch = fixes, minor = new features, major = changes that break Apps"
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Releases are cut from main
        if: github.event_name == 'workflow_dispatch'
        run: test "${GITHUB_REF}" = "refs/heads/main"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # main's ruleset lets only this deploy key push without a pull request.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: A pushed tag must be on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Bump the version
        if: github.event_name == 'workflow_dispatch'
        run: uv version --bump "${{ inputs.bump }}"
      - name: The tag must name the version in pyproject.toml
        if: github.event_name == 'push'
        run: test "v$(uv version --short)" = "${GITHUB_REF_NAME}"
      - run: uv run ruff check .
      - run: uv run vulture
      - run: uv run pytest
      - run: uv build --no-sources
      - id: version
        run: echo "version=$(uv version --short)" >> "${GITHUB_OUTPUT}"
      - name: Commit the bump and tag it
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(uv version --short)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release v${version}" -- pyproject.toml uv.lock
          git tag "v${version}"
          git push origin HEAD:main
          # The tag goes up with the job's token: a push made with that token
          # starts no workflow, so this run doesn't start a second release.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v${version}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The `pypi` environment has required reviewers, so the job waits for a
    # manual approval before it can ask PyPI for a publishing token.
    environment:
      name: pypi
      url: https://pypi.org/project/django-entra-staff/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv publish --trusted-publishing always

  github-release:
    # Only after PyPI took the upload, so the Releases page lists only versions
    # that exist on PyPI.
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "v${VERSION}" \
            --generate-notes \
            --notes "On PyPI: https://pypi.org/project/django-entra-staff/${VERSION}/"
